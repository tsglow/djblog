{% extends "base.html" %}
{% load static %}
    {% block title %}
    {{post.title}}        
    {% endblock  %}

    {% block css %}
    <link rel="stylesheet" href="{% static "blog/post.css" %}">    
    <link rel="stylesheet" href="{% static "blog/details.css" %}">
    {% endblock %}
    
    
    {% block content %}        
    <section id="summary">
        <h2>{{post.title}}</h2>
        <article>
            <img src="{% static '/blog/images/'|add:post.image %}"/>
            <address>{{post.author}}</address>
            <div>
                last updated on <time>{{post.date|date:"Y M d"}}</time>
            </div>
        </article>
    </section>
    <main>
        <p>{{post.content|linebreaks}}</p>
    </main>       


    {% endblock %}
